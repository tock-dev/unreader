<!DOCTYPE html>
<html>
<head>
    <title>VNC Remote Control System</title>
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Kontener na ekran telefonu/komputera */
        #vnc-target { width: 100vw; height: 100vh; display: none; }
        #vnc-target canvas { width: 100% !important; height: 100% !important; object-fit: contain; }
        
        #control-panel { position: absolute; z-index: 100; background: rgba(0,0,0,0.95); padding: 25px; border-radius: 8px; color: white; border: 1px solid #333; text-align: center; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        input { padding: 10px; width: 220px; background: #222; border: 1px solid #444; color: white; margin-bottom: 15px; display: block; border-radius: 4px; text-align: center; font-size: 14px; }
        button { padding: 12px 20px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; border-radius: 4px; font-size: 14px; text-transform: uppercase; }
        button:hover { background: #218838; }

        /* Ekran ładowania */
        #loading-panel { position: absolute; z-index: 150; text-align: center; color: #aaa; font-size: 18px; letter-spacing: 1px; display: none; }

        /* Komunikat o błędzie offline */
        #error-panel { position: absolute; z-index: 200; background: #2a0808; padding: 30px; border-radius: 8px; color: #ff6b6b; border: 2px solid #5a1818; text-align: center; max-width: 350px; display: none; box-shadow: 0 0 20px rgba(255,0,0,0.3); }
        #error-panel h3 { margin: 0 0 10px 0; font-size: 20px; }
        #error-panel p { margin: 0; font-size: 14px; line-height: 1.4; color: #ffb3b3; }
    </style>
</head>
<body>

    <!-- Panel logowania -->
    <div id="control-panel">
        <h3 style="margin: 0 0 10px 0; font-size: 18px;">Remote Control Access</h3>
        <p style="font-size: 12px; color: #aaa; margin: 0 0 20px 0;">Please enter the security password to connect:</p>
        <input type="password" id="vncPassword" placeholder="Enter VNC Password">
        <button onclick="window.launchVNC()">Connect Screen</button>
    </div>

    <!-- Ekran ładowania -->
    <div id="loading-panel">
        Connecting to cody-server_poland2...
    </div>

    <!-- Komunikat o błędzie offline -->
    <div id="error-panel">
        <h3>Connection Failed</h3>
        <p>Uh, oh! It looks like Cody's server is offline! For more information ask him on chat.</p>
    </div>

    <!-- Płótno renderujące obraz VNC i obsługujące dotyk bezpośrednio -->
    <div id="vnc-target"></div>

    <!-- Ładowanie noVNC jako natywnego modułu JS bezpośrednio z sieci CDN -->
    <script type="module">
        import RFB from 'https://jsdelivr.net';

        let rfb;
        let connectionTimeout;

        window.launchVNC = function() {
            const host = "frp.freefrp.net";
            const port = "38452";
            const password = document.getElementById("vncPassword").value.trim();
            
            if (!password) {
                alert("Please enter the password.");
                return;
            }

            // Ukrywanie panelu, pokazywanie napisu Connecting...
            document.getElementById("control-panel").style.display = "none";
            document.getElementById("loading-panel").style.display = "block";

            // Szyfrowane połączenie WebSocket Secure (WSS) wymagane przez HTTPS Rendera
            const wsUrl = `wss://${host}:${port}/`;

            try {
                // Inicjalizacja bezpośredniego połączenia VNC na elemencie div
                rfb = new RFB(document.getElementById('vnc-target'), wsUrl, {
                    credentials: { password: password }
                });

                // Włączenie automatycznego skalowania obrazu do ekranu użytkownika
                rfb.scaleViewport = true;
                rfb.resizeSession = false;

                // 1. Sukces: Połączenie nawiązane poprawnie
                rfb.addEventListener('connect', () => {
                    clearTimeout(connectionTimeout);
                    document.getElementById("loading-panel").style.display = "none";
                    document.getElementById("vnc-target").style.display = "block";
                });

                // 2. Rozłączenie lub błąd w trakcie
                rfb.addEventListener('disconnect', (e) => {
                    clearTimeout(connectionTimeout);
                    document.getElementById("loading-panel").style.display = "none";
                    document.getElementById("vnc-target").style.display = "none";
                    document.getElementById("error-panel").style.display = "block";
                });

            } catch (err) {
                clearTimeout(connectionTimeout);
                showOfflineError();
            }

            // Awaryjny timer (7 sekund) na wypadek całkowitego braku odpowiedzi z sieci (serwer offline)
            connectionTimeout = setTimeout(showOfflineError, 7000);
        };

        function showOfflineError() {
            if (rfb) {
                try { rfb.disconnect(); } catch(e){}
            }
            document.getElementById("loading-panel").style.display = "none";
            document.getElementById("vnc-target").style.display = "none";
            document.getElementById("error-panel").style.display = "block";
        }

        // Autopołączenie po wykryciu zapamiętanego hasła
        window.onload = function() {
            setTimeout(function() {
                const passField = document.getElementById("vncPassword");
                if (passField && passField.value.length > 0) {
                    window.launchVNC();
                }
            }, 500); 
        };
    </script>
</body>
</html>
