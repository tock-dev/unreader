(function(){

      var g=s.gap||s.gap;

      var m=parseInt(g,10);
      if(!m||m<1)return;
      el._gapFixed=true;
      Array.from(el.children).forEach(function(child,i){
        if(i>0){
          var isRow=s.flexDirection==='column'||s.flexDirection==='column-reverse';
          if(isRow)child.style.marginTop=m+'px';
          else child.style.marginLeft=m+'px';
