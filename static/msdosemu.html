<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>js-dos with Virtual Keyboard</title>

  <!-- js-dos v7 CDN Assets -->
  <script src="https://v7.js-dos.com/latest/js-dos.js"></script>
  <link href="https://v7.js-dos.com/latest/js-dos.css" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    #dos-container {
      width: 640px;
      height: 400px;
      max-width: 100%;
      background: #000;
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    .keyboard-container {
      margin-top: 1rem;
      width: 100%;
      max-width: 640px;
      background: #1e1e1e;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 0.3rem;
    }

    .key {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.6rem 0;
      flex: 1;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .key:active {
      background: #007acc;
    }

    .key-wide { flex: 1.5; }
    .key-space { flex: 4; }
  </style>
</head>
<body>

  <!-- Container for js-dos v7 -->
  <div id="dos-container"></div>

  <!-- On-Screen Keyboard -->
  <div class="keyboard-container">
    <div class="keyboard-row">
      <button class="key" data-code="Escape">ESC</button>
      <button class="key" data-code="F1">F1</button>
      <button class="key" data-code="F2">F2</button>
      <button class="key" data-code="F3">F3</button>
      <button class="key" data-code="F4">F4</button>
      <button class="key key-wide" data-code="Enter">ENTER</button>
    </div>

    <div class="keyboard-row">
      <button class="key" data-code="Digit1">1</button>
      <button class="key" data-code="Digit2">2</button>
      <button class="key" data-code="Digit3">3</button>
      <button class="key" data-code="Digit4">4</button>
      <button class="key" data-code="Digit5">5</button>
      <button class="key" data-code="Digit6">6</button>
      <button class="key" data-code="Digit7">7</button>
      <button class="key" data-code="Digit8">8</button>
      <button class="key" data-code="Digit9">9</button>
      <button class="key" data-code="Digit0">0</button>
      <button class="key key-wide" data-code="Backspace">BKSP</button>
    </div>

    <div class="keyboard-row">
      <button class="key key-wide" data-code="Tab">TAB</button>
      <button class="key" data-code="ArrowUp">▲</button>
      <button class="key" data-code="ArrowDown">▼</button>
      <button class="key" data-code="ArrowLeft">◄</button>
      <button class="key" data-code="ArrowRight">►</button>
      <button class="key key-space" data-code="Space">SPACE</button>
    </div>

    <div class="keyboard-row">
      <button class="key" data-code="KeyY">Y</button>
      <button class="key" data-code="KeyN">N</button>
      <button class="key" data-code="KeyC">C</button>
      <button class="key" data-code="KeyD">D</button>
      <button class="key" data-macro="DIR">DIR</button>
      <button class="key" data-macro="CLS">CLS</button>
    </div>
  </div>

  <script>
    // 1. Tell js-dos explicitly where to load WebAssembly modules from
    emulators.pathPrefix = "https://v7.js-dos.com/latest/emulators/";

    let ciInstance = null;

    // 2. Start DOS using a verified working test bundle
    Dos(document.getElementById("dos-container"))
      .run("https://v7.js-dos.com/latest/digger.jsdos")
      .then((ci) => {
        ciInstance = ci;
      });

    // 3. Dispatch keyboard strokes directly to the WASM runtime
    function sendKeyCode(code) {
      if (!ciInstance) return;
      
      // js-dos v7 accepts standard KeyboardEvent.code strings
      ciInstance.sendKeyEvent(code, true);
      setTimeout(() => {
        ciInstance.sendKeyEvent(code, false);
      }, 50);
    }

    // 4. Attach event handlers to virtual key buttons
    document.querySelectorAll(".key").forEach((button) => {
      button.addEventListener("click", () => {
        const code = button.getAttribute("data-code");
        const macro = button.getAttribute("data-macro");

        if (macro) {
          // Send macro letters one by one followed by Enter
          for (let i = 0; i < macro.length; i++) {
            setTimeout(() => {
              sendKeyCode(`Key${macro[i].toUpperCase()}`);
            }, i * 100);
          }
          setTimeout(() => sendKeyCode("Enter"), macro.length * 100);
        } else if (code) {
          sendKeyCode(code);
        }
      });
    });
  </script>
</body>
</html>
