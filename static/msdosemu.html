<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>js-dos with On-Screen Keyboard</title>

  <!-- js-dos 6.22 scripts -->
  <script src="https://cdn.jsdelivr.net/npm/js-dos@6.22.10/dist/js-dos.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    #dos-wrapper {
      width: 640px;
      height: 400px;
      max-width: 100%;
      background: #000;
      border: 2px solid #333;
      border-radius: 8px;
      position: relative;
    }

    /* DOS Canvas must fill the container */
    #dos {
      width: 100%;
      height: 100%;
    }

    /* On-Screen Keyboard */
    .keyboard-container {
      margin-top: 1rem;
      width: 100%;
      max-width: 640px;
      background: #1e1e1e;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 0.3rem;
    }

    .key {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 4px;
      color: #fff;
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.6rem 0;
      flex: 1;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .key:active {
      background: #007acc;
    }

    .key-wide { flex: 1.5; }
    .key-space { flex: 4; }
  </style>
</head>
<body>

  <!-- DOS Canvas Container -->
  <div id="dos-wrapper">
    <canvas id="dos"></canvas>
  </div>

  <!-- Built-in Virtual Keyboard -->
  <div class="keyboard-container">
    <div class="keyboard-row">
      <button class="key" data-key="27">ESC</button>
      <button class="key" data-key="112">F1</button>
      <button class="key" data-key="113">F2</button>
      <button class="key" data-key="114">F3</button>
      <button class="key" data-key="115">F4</button>
      <button class="key key-wide" data-key="13">ENTER</button>
    </div>

    <div class="keyboard-row">
      <button class="key" data-key="49">1</button>
      <button class="key" data-key="50">2</button>
      <button class="key" data-key="51">3</button>
      <button class="key" data-key="52">4</button>
      <button class="key" data-key="53">5</button>
      <button class="key" data-key="54">6</button>
      <button class="key" data-key="55">7</button>
      <button class="key" data-key="56">8</button>
      <button class="key" data-key="57">9</button>
      <button class="key" data-key="48">0</button>
      <button class="key key-wide" data-key="8">BKSP</button>
    </div>

    <div class="keyboard-row">
      <button class="key key-wide" data-key="9">TAB</button>
      <button class="key" data-key="38">▲</button>
      <button class="key" data-key="40">▼</button>
      <button class="key" data-key="37">◄</button>
      <button class="key" data-key="39">►</button>
      <button class="key key-space" data-key="32">SPACE</button>
    </div>

    <div class="keyboard-row">
      <button class="key" data-key="89">Y</button>
      <button class="key" data-key="78">N</button>
      <button class="key" data-key="67">C</button>
      <button class="key" data-key="68">D</button>
      <button class="key" data-macro="DIR">DIR</button>
      <button class="key" data-macro="CLS">CLS</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("dos");

    // Initialize DOS box pointing to a reliable test ZIP bundle
    Dos(canvas, {
      wdosboxUrl: "https://cdn.jsdelivr.net/npm/js-dos@6.22.10/dist/wdosbox.js"
    }).ready((dos, val) => {
      // Run a lightweight FreeDOS/Digger bundle to ensure canvas renders immediately
      dos.run("https://cdn.dos.zone/custom/dos/digger.zip");
    });

    // Send synthetic key event to the canvas
    function pressKeyCode(keyCode) {
      canvas.dispatchEvent(new KeyboardEvent("keydown", { keyCode: keyCode, bubbles: true }));
      setTimeout(() => {
        canvas.dispatchEvent(new KeyboardEvent("keyup", { keyCode: keyCode, bubbles: true }));
      }, 50);
    }

    // Attach click handlers to virtual key buttons
    document.querySelectorAll(".key").forEach((button) => {
      button.addEventListener("click", () => {
        const key = button.getAttribute("data-key");
        const macro = button.getAttribute("data-macro");

        if (macro) {
          // Macro typing
          for (let i = 0; i < macro.length; i++) {
            setTimeout(() => {
              pressKeyCode(macro.charCodeAt(i));
            }, i * 100);
          }
          setTimeout(() => pressKeyCode(13), macro.length * 100); // Press Enter
        } else if (key) {
          pressKeyCode(parseInt(key, 10));
        }
      });
    });
  </script>
</body>
</html>
