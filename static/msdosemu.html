<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js-dos Shell with Virtual Keyboard</title>

    <!-- js-dos style sheet -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">

    <!-- js-dos script -->
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        /* Container wrapper for the emulator */
        #dos-wrapper {
            width: 100%;
            max-width: 640px;
            height: 400px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
        }

        #dos {
            width: 100%;
            height: 100%;
        }

        /* Virtual Keyboard Layout */
        .keyboard-container {
            margin-top: 12px;
            width: 100%;
            max-width: 640px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .key {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 10px 0;
            flex: 1;
            text-align: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }

        .key:active {
            background: #007acc;
        }

        .key-wide { flex: 1.5; }
        .key-space { flex: 4; }
    </style>
</head>
<body>

    <div id="dos-wrapper">
        <div id="dos"></div>
    </div>

    <!-- Built-in Virtual Keyboard -->
    <div class="keyboard-container">
        <!-- Row 1: Function Keys -->
        <div class="keyboard-row">
            <button class="key" data-code="Escape">ESC</button>
            <button class="key" data-code="F1">F1</button>
            <button class="key" data-code="F2">F2</button>
            <button class="key" data-code="F3">F3</button>
            <button class="key" data-code="F4">F4</button>
            <button class="key key-wide" data-code="Enter">ENTER</button>
        </div>

        <!-- Row 2: Numbers -->
        <div class="keyboard-row">
            <button class="key" data-code="Digit1">1</button>
            <button class="key" data-code="Digit2">2</button>
            <button class="key" data-code="Digit3">3</button>
            <button class="key" data-code="Digit4">4</button>
            <button class="key" data-code="Digit5">5</button>
            <button class="key" data-code="Digit6">6</button>
            <button class="key" data-code="Digit7">7</button>
            <button class="key" data-code="Digit8">8</button>
            <button class="key" data-code="Digit9">9</button>
            <button class="key" data-code="Digit0">0</button>
            <button class="key key-wide" data-code="Backspace">BKSP</button>
        </div>

        <!-- Row 3: Arrows & Space -->
        <div class="keyboard-row">
            <button class="key key-wide" data-code="Tab">TAB</button>
            <button class="key" data-code="ArrowUp">▲</button>
            <button class="key" data-code="ArrowDown">▼</button>
            <button class="key" data-code="ArrowLeft">◄</button>
            <button class="key" data-code="ArrowRight">►</button>
            <button class="key key-space" data-code="Space">SPACE</button>
        </div>

        <!-- Row 4: Common Commands & Letters -->
        <div class="keyboard-row">
            <button class="key" data-code="KeyY">Y</button>
            <button class="key" data-code="KeyN">N</button>
            <button class="key" data-code="KeyC">C</button>
            <button class="key" data-code="KeyD">D</button>
            <button class="key" data-macro="DIR">DIR</button>
            <button class="key" data-macro="CLS">CLS</button>
        </div>
    </div>

    <script>
        let dosInterface = null;

        // Initialize js-dos v8 without passing a game bundle.
        // Calling Dos() with no bundle URL automatically boots pure FreeDOS.
        Dos(document.getElementById("dos")).then((ci) => {
            dosInterface = ci;
        });

        // Helper function to send key events into js-dos
        function pressKey(code) {
            if (!dosInterface) return;

            dosInterface.sendKeyEvent(code, true);
            setTimeout(() => {
                dosInterface.sendKeyEvent(code, false);
            }, 50);
        }

        // Attach event listeners to all virtual key buttons
        document.querySelectorAll(".key").forEach((button) => {
            button.addEventListener("click", () => {
                const code = button.getAttribute("data-code");
                const macro = button.getAttribute("data-macro");

                if (macro) {
                    for (let i = 0; i < macro.length; i++) {
                        setTimeout(() => {
                            pressKey(`Key${macro[i].toUpperCase()}`);
                        }, i * 100);
                    }
                    setTimeout(() => pressKey("Enter"), macro.length * 100);
                } else if (code) {
                    pressKey(code);
                }
            });
        });
    </script>
</body>
</html>
