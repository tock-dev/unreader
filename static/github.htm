<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GitHub // E-Ink Workspace</title>
<style>
:root {
  --border: 2px solid #000000;
  --shadow: 4px 4px 0px #000000;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: monospace;
  background: #ffffff;
  color: #000000;
  overflow: hidden;
}

/* 37px Top Bar */
#top-bar {
  height: 37px;
  box-sizing: border-box;
  border-bottom: var(--border);
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px;
  font-weight: bold;
  font-size: 13px;
}

/* --- WORKSPACE TABLE & SIDEBAR --- */
#workspace-table {
  width: 100%;
  height: calc(100% - 37px);
  border-collapse: collapse;
  display: flex;
  align-items: stretch;
}

#sidebar-cell {
  width: 35%;
  max-width: 280px;
  background: #fafafa;
  border-right: var(--border);
  vertical-align: top;
  padding: 0;
  overflow-y: auto;
  flex-shrink: 0;
}

#chat-cell {
  vertical-align: top;
  padding: 0;
  position: relative;
  background-color: #ffffff;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.panel-header {
  font-weight: bold;
  padding: 6px 8px;
  text-transform: uppercase;
  border-bottom: var(--border);
  border-top: var(--border);
  background: #eee;
  font-size: 12px;
  letter-spacing: 1px;
}

.panel-header:first-child {
  border-top: none;
}

.roster-user {
  padding: 4px 8px;
  border-bottom: 1px solid #eee;
  font-size: 12px;
}

.roster-name {
  font-weight: bold;
  cursor: pointer;
  text-decoration: underline;
}

.nav-item {
  padding: 6px 10px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
  font-size: 12px;
  background: white;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-item:hover {
  background: #f0f0f0;
}

.nav-item-active {
  background-color: #000000 !important;
  color: #ffffff !important;
  font-weight: bold;
}

.sidebar-input-container {
  display: flex;
  padding: 4px;
  background: white;
  border-bottom: 1px solid #eee;
  width: 100%;
  box-sizing: border-box;
}

.sidebar-input {
  display: block;
  flex-grow: 1;
  min-width: 0px;
  padding: 3px;
  font-family: monospace;
  font-size: 11px;
  outline: none;
  border: 1px solid black;
}

.sidebar-btn {
  font-family: monospace;
  font-size: 10px;
  background: white;
  border: 1px solid black;
  margin-left: 2px;
  cursor: pointer;
}

#pagination-header-bar {
  padding: 6px;
  background: #eee;
  border-bottom: var(--border);
  text-align: center;
  height: 26px;
  flex-grow: 0;
  flex-shrink: 0;
}

.page-btn {
  background: #ffffff;
  border: var(--border);
  padding: 2px 8px;
  font-family: monospace;
  font-weight: bold;
  cursor: pointer;
  font-size: 11px;
  box-shadow: 1px 1px 0 black;
}

#page-display-index {
  margin: 0 10px;
  font-size: 14px;
  font-weight: bold;
}

#chat-scroll-wrapper {
  overflow-y: auto;
  padding: 12px;
  flex-grow: 1;
}

#input-bar-container {
  display: flex;
  background-color: #eee;
  padding: 8px;
  box-sizing: border-box;
  border-top: var(--border);
  z-index: 20;
  height: max-content;
  align-items: stretch;
}

#content {
  display: block;
  flex-grow: 1;
  padding: 6px;
  font-size: 13px;
  border: var(--border);
  outline: none;
  background: white;
  box-sizing: border-box;
  resize: none;
  overflow-y: hidden;
  box-shadow: 2px 2px 0 black;
  font-family: monospace;
}

#send {
  min-width: calc(max-content + 1em);
  aspect-ratio: 1;
  cursor: pointer;
  font-family: monospace;
  font-weight: bold;
  font-size: 12px;
  background: white;
  border: var(--border);
  box-shadow: 2px 2px 0 black;
  margin-left: 8px;
  padding: 0 10px;
}

.message-text {
  font-size: 13px;
  white-space: pre-wrap;
  line-height: 1.3;
  color: black;
  word-break: break-word;
}

.message {
  max-width: 95%;
  margin-top: 0.6em;
  border: var(--border);
  padding: 8px;
  background: #fff;
  box-shadow: 2px 2px 0 black;
}

.mod-msg,
.admin-msg {
  margin-top: 0.5em;
  padding: 8px;
}

.mod-msg {
  border: 3px solid #0000ff !important;
  box-shadow: 4px 4px 0px #0000ff50 !important;
}

.admin-msg {
  background: black !important;
  color: white !important;
  border: 3px solid black !important;
  box-shadow: 4px 4px 0px #0000004a !important;
}

.admin-msg .message-text {
  color: white !important;
}

.purged-msg {
  border-style: dotted !important;
  background: #fafafa !important;
  opacity: 0.6;
}

.mod-action-tray {
  display: block;
  background: #fff;
  border: 1px dashed red;
  padding: 4px;
  font-size: 11px;
  font-family: monospace;
  margin-top: 4px;
  max-width: 100%;
  box-sizing: border-box;
}

.mod-tray-btn {
  background: white;
  border: 1px solid black;
  font-size: 10px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 4px;
  padding: 1px 4px;
  font-family: monospace;
}

.auth-box {
  background: white;
  border: var(--border);
  box-shadow: var(--shadow);
  padding: 30px;
  text-align: center;
  width: 280px;
}

.auth-box h2 {
  font-size: 18px;
  letter-spacing: 2px;
  border-bottom: 2px solid black;
  padding-bottom: 5px;
  margin-bottom: 20px;
}

.auth-box input {
  display: block;
  width: 100%;
  margin-bottom: 15px;
  padding: 10px;
  border: var(--border);
  font-family: monospace;
  box-sizing: border-box;
  font-size: 14px;
}

.auth-box button {
  width: 100%;
  padding: 12px;
  background: white;
  border: var(--border);
  box-shadow: 4px 4px 0px black;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
  font-family: monospace;
  margin-bottom: 8px;
}

.auth-box button:active {
  box-shadow: none;
  transform: translate(2px, 2px);
}

#auth-screen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #e5e5e5;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.paper-btn {
  font-family: monospace;
  font-size: 12px;
  background: white;
  border: 2px solid black;
  cursor: pointer;
  padding: 3px 6px;
}

.paper-input {
  font-size: 12px;
  background: white;
  border: 2px solid black;
  cursor: text;
  outline: none;
  box-sizing: border-box;
  padding: 5px;
}

.shadow {
  box-shadow: 2px 2px 0px black;
}

.readme-content img {
  max-width: 100%;
  height: auto;
  filter: grayscale(100%) contrast(120%);
  border: 1px solid #000;
}
.readme-content pre {
  background: #f4f4f4;
  border: 1px solid #000;
  padding: 6px;
  white-space: pre-wrap;
  word-break: break-all;
}
</style>
</head>
<body>

<!-- Optional Token Auth Modal -->
<div id="auth-screen">
  <div class="auth-box">
    <h2>GITHUB TOKEN</h2>
    <input type="password" id="token-input" placeholder="ghp_xxxxxxxxxxxx">
    <button onclick="saveToken()">SAVE TOKEN</button>
    <button onclick="toggleAuth(false)">CLOSE</button>
  </div>
</div>

<!-- 37px Top Header Bar -->
<div id="top-bar">
  <span>GITHUB // PAPERWHITE</span>
  <div>
    <button class="paper-btn shadow" onclick="toggleAuth(true)">KEY</button>
    <button class="paper-btn shadow" onclick="flashInk()">INK REFRESH</button>
  </div>
</div>

<!-- Main Workspace Table -->
<div id="workspace-table">

  <!-- Left Sidebar -->
  <div id="sidebar-cell">
    <div class="panel-header">QUICK OPEN</div>
    <div class="sidebar-input-container">
      <input type="text" id="repo-input" class="sidebar-input" value="koreader/koreader" placeholder="owner/repo">
      <button class="sidebar-btn" onclick="loadRepoFromInput()">GO</button>
    </div>

    <div class="panel-header">NAVIGATION</div>
    <div id="nav-home" class="nav-item nav-item-active" onclick="showHome()">🏠 Home Dashboard</div>
    <div id="nav-readme" class="nav-item" onclick="switchTab('readme')">📖 README.md</div>
    <div id="nav-files" class="nav-item" onclick="switchTab('files')">📁 File Explorer</div>
    <div id="nav-issues" class="nav-item" onclick="switchTab('issues')">🐛 Issues</div>
    <div id="nav-releases" class="nav-item" onclick="switchTab('releases')">🏷️ Releases</div>

    <div class="panel-header">REPOSITORY INFO</div>
    <div id="repo-stats">
      <div class="roster-user">Current: <span class="roster-name" id="stat-current">Home</span></div>
      <div class="roster-user">Stars: <span class="roster-name" id="stat-stars">-</span></div>
      <div class="roster-user">Forks: <span class="roster-name" id="stat-forks">-</span></div>
    </div>

    <div class="panel-header">MY REPOSITORIES</div>
    <div id="sidebar-my-repos">
      <div class="roster-user" style="color: #666;">Enter KEY token above to load your repos.</div>
    </div>

    <div class="panel-header" id="sidebar-tree-header" style="display:none;">FILE TREE</div>
    <div id="sidebar-tree"></div>
  </div>

  <!-- Right Main Content Cell -->
  <div id="chat-cell">
    <div id="pagination-header-bar">
      <button class="page-btn" onclick="changePage(-1)">&lt; PREV</button>
      <span id="page-display-index">Page 1 / 1</span>
      <button class="page-btn" onclick="changePage(1)">NEXT &gt;</button>
    </div>

    <div id="chat-scroll-wrapper">
      <div id="main-view">Loading home dashboard...</div>
    </div>

    <div id="input-bar-container">
      <input type="text" id="content" placeholder="Search GitHub repos globally (e.g. esp32, kindle, linux)...">
      <button id="send" onclick="searchGitHub()">SEARCH</button>
    </div>
  </div>

</div>

<script>
var currentRepo = '';
var ghToken = '';
var pages = ['Loading...'];
var currentPage = 0;
var currentFileSha = '';
var currentFileRaw = '';
var currentFilePath = '';

function apiRequest(method, url, acceptHeader, bodyObj, callback) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  xhr.setRequestHeader('Accept', acceptHeader || 'application/vnd.github+json');
  if (ghToken) {
    xhr.setRequestHeader('Authorization', 'Bearer ' + ghToken);
  }
  if (bodyObj) {
    xhr.setRequestHeader('Content-Type', 'application/json');
  }
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) {
        callback(null, xhr.responseText);
      } else {
        callback('HTTP ' + xhr.status + ' Error: ' + xhr.responseText);
      }
    }
  };
  xhr.send(bodyObj ? JSON.stringify(bodyObj) : null);
}

function utf8ToBase64(str) {
  return window.btoa(unescape(encodeURIComponent(str)));
}

function setActiveNav(id) {
  var ids = ['nav-home', 'nav-readme', 'nav-files', 'nav-issues', 'nav-releases'];
  for (var i = 0; i < ids.length; i++) {
    var el = document.getElementById(ids[i]);
    if (el) {
      el.className = (ids[i] === id) ? 'nav-item nav-item-active' : 'nav-item';
    }
  }
}

function setPages(pageArray) {
  pages = pageArray.length ? pageArray : ['No content available.'];
  currentPage = 0;
  renderCurrentPage();
}

function renderCurrentPage() {
  document.getElementById('main-view').innerHTML = pages[currentPage];
  document.getElementById('page-display-index').innerHTML = 'Page ' + (currentPage + 1) + ' / ' + pages.length;
  document.getElementById('chat-scroll-wrapper').scrollTop = 0;
}

function changePage(delta) {
  var next = currentPage + delta;
  if (next >= 0 && next < pages.length) {
    currentPage = next;
    renderCurrentPage();
  }
}

// --- HOME SCREEN & MY REPOS ---
function showHome() {
  setActiveNav('nav-home');
  currentRepo = '';
  document.getElementById('stat-current').innerHTML = 'Home';
  document.getElementById('stat-stars').innerHTML = '-';
  document.getElementById('stat-forks').innerHTML = '-';
  document.getElementById('sidebar-tree-header').style.display = 'none';
  document.getElementById('sidebar-tree').innerHTML = '';

  var html = '<div class="admin-msg"><div class="message-text"><b>GITHUB E-INK DASHBOARD // HOME</b></div></div>';
  html += '<div class="message"><div class="message-text">';
  html += 'Welcome to your Kindle GitHub client! Choose a featured repo below, search globally using the bottom bar, or tap <b>KEY</b> in the top right to load your own repositories.<br><br>';
  html += '<b>🔥 Featured / Tuff Repositories:</b><br>';
  html += '• <span class="roster-name" onclick="loadRepo(\'koreader/koreader\')">koreader/koreader</span> — E-ink document reader<br>';
  html += '• <span class="roster-name" onclick="loadRepo(\'torvalds/linux\')">torvalds/linux</span> — Linux Kernel source<br>';
  html += '• <span class="roster-name" onclick="loadRepo(\'espressif/esp-idf\')">espressif/esp-idf</span> — ESP32 IoT Development<br>';
  html += '• <span class="roster-name" onclick="loadRepo(\'git/git\')">git/git</span> — Git source code<br>';
  html += '</div></div>';

  if (ghToken) {
    html += '<div class="admin-msg" style="margin-top:15px;"><div class="message-text"><b>YOUR AUTHENTICATED REPOSITORIES</b></div></div>';
    html += '<div id="home-my-repos"><div class="message"><div class="message-text">Loading your repos...</div></div></div>';
    fetchMyReposForHome(function(repoListHtml) {
      var el = document.getElementById('home-my-repos');
      if (el) el.innerHTML = repoListHtml;
    });
  } else {
    html += '<div class="admin-msg" style="margin-top:15px;"><div class="message-text"><b>YOUR REPOSITORIES</b></div></div>';
    html += '<div class="message"><div class="message-text">Tap <b>KEY</b> in the top bar and enter your GitHub Token to see your personal and organization repositories here!</div></div>';
  }

  setPages([html]);
}

function fetchMyReposForHome(callback) {
  apiRequest('GET', 'https://api.github.com/user/repos?sort=updated&per_page=12', null, null, function(err, res) {
    if (err) {
      callback('<div class="message"><div class="message-text">Failed to load user repos: ' + err + '</div></div>');
      return;
    }
    var repos = JSON.parse(res);
    if (!repos.length) {
      callback('<div class="message"><div class="message-text">No repositories found on this account.</div></div>');
      return;
    }
    var html = '';
    var sidebarHtml = '';
    for (var i = 0; i < repos.length; i++) {
      var r = repos[i];
      html += '<div class="message"><div class="message-text">';
      html += '<span class="roster-name" onclick="loadRepo(\'' + r.full_name + '\')">' + r.full_name + '</span> (★ ' + r.stargazers_count + ')\n';
      html += (r.description || 'No description.');
      html += '</div><div class="mod-action-tray"><button class="mod-tray-btn" onclick="loadRepo(\'' + r.full_name + '\')">OPEN REPO</button></div></div>';
      
      sidebarHtml += '<div class="roster-user"><span class="roster-name" onclick="loadRepo(\'' + r.full_name + '\')">' + r.name + '</span></div>';
    }
    document.getElementById('sidebar-my-repos').innerHTML = sidebarHtml;
    callback(html);
  });
}

function loadRepoFromInput() {
  var val = document.getElementById('repo-input').value.replace(/^\s+|\s+$/g, '');
  if (val) loadRepo(val);
}

function loadRepo(repoName) {
  currentRepo = repoName;
  document.getElementById('repo-input').value = repoName;
  document.getElementById('stat-current').innerHTML = repoName;
  setPages(['<div class="message"><div class="message-text">Fetching ' + repoName + '...</div></div>']);

  apiRequest('GET', 'https://api.github.com/repos/' + repoName, null, null, function(err, res) {
    if (err) {
      setPages(['<div class="message mod-indicator-btn"><div class="message-text">' + err + '</div></div>']);
      return;
    }
    var data = JSON.parse(res);
    document.getElementById('stat-stars').innerHTML = data.stargazers_count;
    document.getElementById('stat-forks').innerHTML = data.forks_count || 0;
    document.getElementById('sidebar-tree-header').style.display = 'block';
    loadDirectory('', true);
    switchTab('readme');
  });
}

function switchTab(tab) {
  if (!currentRepo) {
    alert('Please select a repository first from Home or the Quick Open input!');
    showHome();
    return;
  }
  if (tab === 'readme') { setActiveNav('nav-readme'); loadReadme(); }
  if (tab === 'files') { setActiveNav('nav-files'); loadDirectory(''); }
  if (tab === 'issues') { setActiveNav('nav-issues'); loadIssues(); }
  if (tab === 'releases') { setActiveNav('nav-releases'); loadReleases(); }
}

function loadReadme() {
  setPages(['<div class="message"><div class="message-text">Loading README.md...</div></div>']);
  apiRequest('GET', 'https://api.github.com/repos/' + currentRepo + '/readme', 'application/vnd.github.html+json', null, function(err, html) {
    if (err) {
      setPages(['<div class="message purged-msg"><div class="message-text">No README found in this repository.</div></div>']);
      return;
    }
    var header = '<div class="admin-msg"><div class="message-text"><b>' + currentRepo + ' // README.md</b></div></div>';
    var modTray = '<div class="mod-action-tray">MOD ACTIONS: <button class="mod-tray-btn" onclick="viewFile(\'README.md\')">✏️ VIEW / EDIT RAW README.md</button></div>';
    setPages([header + modTray + '<div class="message readme-content"><div class="message-text">' + html + '</div></div>']);
  });
}

function loadDirectory(path, sidebarOnly) {
  if (!currentRepo) return;
  apiRequest('GET', 'https://api.github.com/repos/' + currentRepo + '/contents/' + path, null, null, function(err, res) {
    if (err) return;
    var items = JSON.parse(res);
    var treeHtml = '';
    var mainHtml = '<div class="admin-msg"><div class="message-text"><b>INDEX OF /' + path + '</b></div></div>';

    mainHtml += '<div class="mod-action-tray">MOD ACTIONS: ';
    if (path !== '') {
      var parent = path.indexOf('/') === -1 ? '' : path.substring(0, path.lastIndexOf('/'));
      treeHtml += '<div class="nav-item" onclick="loadDirectory(\'' + parent + '\', false)">⬅ .. (UP)</div>';
      mainHtml += '<button class="mod-tray-btn" onclick="loadDirectory(\'' + parent + '\', false)">⬅ UP DIR</button> ';
    }
    mainHtml += '<button class="mod-tray-btn" onclick="openNewFileEditor(\'' + path + '\')">+ NEW FILE HERE</button></div>';

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.type === 'dir') {
        treeHtml += '<div class="nav-item" onclick="loadDirectory(\'' + it.path + '\', false)">📁 ' + it.name + '/</div>';
        mainHtml += '<div class="message"><div class="message-text">📁 <span class="roster-name" onclick="loadDirectory(\'' + it.path + '\', false)">' + it.name + '/</span></div></div>';
      } else {
        treeHtml += '<div class="nav-item" onclick="viewFile(\'' + it.path + '\')">📄 ' + it.name + '</div>';
        mainHtml += '<div class="message"><div class="message-text">📄 <span class="roster-name" onclick="viewFile(\'' + it.path + '\')">' + it.name + '</span> (' + it.size + ' B)</div></div>';
      }
    }
    document.getElementById('sidebar-tree').innerHTML = treeHtml;
    if (!sidebarOnly) {
      setActiveNav('nav-files');
      setPages([mainHtml]);
    }
  });
}

function viewFile(path) {
  setActiveNav('nav-files');
  currentFilePath = path;
  setPages(['<div class="message"><div class="message-text">Opening ' + path + '...</div></div>']);

  apiRequest('GET', 'https://api.github.com/repos/' + currentRepo + '/contents/' + path, null, null, function(metaErr, metaRes) {
    if (!metaErr) {
      var metaObj = JSON.parse(metaRes);
      currentFileSha = metaObj.sha;
    }

    apiRequest('GET', 'https://api.github.com/repos/' + currentRepo + '/contents/' + path, 'application/vnd.github.raw+json', null, function(err, raw) {
      if (err) {
        setPages(['<div class="message"><div class="message-text">' + err + '</div></div>']);
        return;
      }
      currentFileRaw = raw;
      var safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      var lines = safe.split('\n');
      var linesPerPage = 35;
      var chunks = [];

      var modBar = '<div class="mod-action-tray">FILE MOD: ' +
        '<button class="mod-tray-btn" onclick="openFileEditor()">✏️ EDIT FILE</button>' +
        '<button class="mod-tray-btn" onclick="deleteCurrentFile()">🗑️ DELETE FILE</button>' +
        '</div>';

      for (var i = 0; i < lines.length; i += linesPerPage) {
        var slice = lines.slice(i, i + linesPerPage);
        var numbered = '';
        for (var j = 0; j < slice.length; j++) {
          var lineNum = i + j + 1;
          var pad = lineNum < 10 ? '  ' + lineNum : (lineNum < 100 ? ' ' + lineNum : lineNum);
          numbered += pad + ' | ' + slice[j] + '\n';
        }
        var header = '<div class="admin-msg"><div class="message-text"><b>FILE: ' + path + ' (Lines ' + (i + 1) + '-' + Math.min(i + linesPerPage, lines.length) + ')</b></div></div>';
        chunks.push(header + modBar + '<div class="message"><div class="message-text">' + numbered + '</div></div>');
      }
      setPages(chunks);
    });
  });
}

function openFileEditor() {
  if (!ghToken) {
    alert('Tap KEY in the top bar and save your GitHub Token first!');
    toggleAuth(true);
    return;
  }
  var safeText = currentFileRaw.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  var html = '<div class="admin-msg"><div class="message-text"><b>EDITING // ' + currentFilePath + '</b></div></div>';
  html += '<div class="message"><div class="message-text">';
  html += '<b>Commit Message:</b><br>';
  html += '<input type="text" id="commit-msg" class="paper-input" style="width:100%;margin:4px 0 10px 0;" value="Update ' + currentFilePath + ' via Kindle">';
  html += '<b>File Content:</b><br>';
  html += '<textarea id="editor-box" class="paper-input" style="width:100%;height:240px;font-family:monospace;white-space:pre;">' + safeText + '</textarea>';
  html += '</div>';
  html += '<div class="mod-action-tray">';
  html += '<button class="mod-tray-btn" onclick="commitFileChanges(false)">💾 COMMIT & PUSH</button>';
  html += '<button class="mod-tray-btn" onclick="viewFile(\'' + currentFilePath + '\')">CANCEL</button>';
  html += '</div></div>';
  setPages([html]);
}

function openNewFileEditor(folderPath) {
  if (!ghToken) {
    alert('Tap KEY in the top bar and save your GitHub Token first!');
    toggleAuth(true);
    return;
  }
  var prefix = folderPath ? folderPath + '/' : '';
  var html = '<div class="admin-msg"><div class="message-text"><b>CREATE NEW FILE</b></div></div>';
  html += '<div class="message"><div class="message-text">';
  html += '<b>File Path:</b><br>';
  html += '<input type="text" id="new-file-path" class="paper-input" style="width:100%;margin:4px 0 8px 0;" value="' + prefix + 'newfile.txt">';
  html += '<b>Commit Message:</b><br>';
  html += '<input type="text" id="commit-msg" class="paper-input" style="width:100%;margin:4px 0 8px 0;" value="Create file via Kindle">';
  html += '<b>File Content:</b><br>';
  html += '<textarea id="editor-box" class="paper-input" style="width:100%;height:200px;font-family:monospace;"></textarea>';
  html += '</div>';
  html += '<div class="mod-action-tray">';
  html += '<button class="mod-tray-btn" onclick="commitFileChanges(true)">💾 CREATE & PUSH</button>';
  html += '<button class="mod-tray-btn" onclick="loadDirectory(\'' + folderPath + '\', false)">CANCEL</button>';
  html += '</div></div>';
  setPages([html]);
}

function commitFileChanges(isNew) {
  var targetPath = isNew ? document.getElementById('new-file-path').value.replace(/^\s+|\s+$/g, '') : currentFilePath;
  var msg = document.getElementById('commit-msg').value || 'Updated via Kindle';
  var newContent = document.getElementById('editor-box').value;

  var payload = {
    message: msg,
    content: utf8ToBase64(newContent)
  };
  if (!isNew && currentFileSha) {
    payload.sha = currentFileSha;
  }

  setPages(['<div class="message"><div class="message-text">Pushing commit to ' + targetPath + '...</div></div>']);
  apiRequest('PUT', 'https://api.github.com/repos/' + currentRepo + '/contents/' + targetPath, null, payload, function(err) {
    if (err) {
      setPages(['<div class="message mod-indicator-btn"><div class="message-text">COMMIT FAILED:\n' + err + '</div></div>']);
      return;
    }
    loadDirectory('', true);
    viewFile(targetPath);
  });
}

function deleteCurrentFile() {
  if (!ghToken) {
    alert('Tap KEY in the top bar and save your GitHub Token first!');
    toggleAuth(true);
    return;
  }
  if (!confirm('Delete ' + currentFilePath + ' from ' + currentRepo + '?')) return;

  var payload = {
    message: 'Delete ' + currentFilePath + ' via Kindle',
    sha: currentFileSha
  };
  setPages(['<div class="message"><div class="message-text">Deleting ' + currentFilePath + '...</div></div>']);
  apiRequest('DELETE', 'https://api.github.com/repos/' + currentRepo + '/contents/' + currentFilePath, null, payload, function(err) {
    if (err) {
      setPages(['<div class="message mod-indicator-btn"><div class="message-text">DELETE FAILED:\n' + err + '</div></div>']);
      return;
    }
    loadDirectory('', false);
  });
}

function loadIssues() {
  if (!currentRepo) return;
  setPages(['<div class="message"><div class="message-text">Loading Issues...</div></div>']);
  apiRequest('GET', 'https://api.github.com/repos/' + currentRepo + '/issues?per_page=15', null, null, function(err, res) {
    if (err) {
      setPages(['<div class="message"><div class="message-text">' + err + '</div></div>']);
      return;
    }
    var issues = JSON.parse(res);
    var chunks = [];
    var perPage = 4;
    var modTray = '<div class="mod-action-tray">ISSUES MOD: <button class="mod-tray-btn" onclick="openNewIssueBox()">+ OPEN NEW ISSUE</button></div>';

    if (!issues.length) {
      setPages(['<div class="admin-msg"><div class="message-text"><b>ISSUES // ' + currentRepo + '</b></div></div>' + modTray + '<div class="message purged-msg"><div class="message-text">No open issues.</div></div>']);
      return;
    }

    for (var i = 0; i < issues.length; i += perPage) {
      var html = '<div class="admin-msg"><div class="message-text"><b>ISSUES // ' + currentRepo + '</b></div></div>' + modTray;
      for (var j = i; j < Math.min(i + perPage, issues.length); j++) {
        var iss = issues[j];
        var bodyText = (iss.body || 'No description.').replace(/</g, '&lt;').substring(0, 280);
        html += '<div class="message mod-msg"><div class="message-text"><b>#' + iss.number + ' ' + iss.title + '</b>\nBy @' + iss.user.login + ' | 💬 ' + iss.comments + '\n\n' + bodyText + '...</div></div>';
      }
      chunks.push(html);
    }
    setPages(chunks);
  });
}

function openNewIssueBox() {
  if (!ghToken) {
    alert('Tap KEY in the top bar and save your GitHub Token first!');
    toggleAuth(true);
    return;
  }
  var html = '<div class="admin-msg"><div class="message-text"><b>NEW ISSUE // ' + currentRepo + '</b></div></div>';
  html += '<div class="message"><div class="message-text">';
  html += '<b>Issue Title:</b><br>';
  html += '<input type="text" id="issue-title" class="paper-input" style="width:100%;margin:4px 0 8px 0;" placeholder="Bug or feature title">';
  html += '<b>Description:</b><br>';
  html += '<textarea id="issue-body" class="paper-input" style="width:100%;height:180px;font-family:monospace;"></textarea>';
  html += '</div>';
  html += '<div class="mod-action-tray">';
  html += '<button class="mod-tray-btn" onclick="submitNewIssue()">🚀 POST ISSUE</button>';
  html += '<button class="mod-tray-btn" onclick="loadIssues()">CANCEL</button>';
  html += '</div></div>';
  setPages([html]);
}

function submitNewIssue() {
  var title = document.getElementById('issue-title').value;
  var body = document.getElementById('issue-body').value;
  if (!title) return;
  setPages(['<div class="message"><div class="message-text">Posting issue...</div></div>']);
  apiRequest('POST', 'https://api.github.com/repos/' + currentRepo + '/issues', null, { title: title, body: body }, function(err) {
    if (err) {
      setPages(['<div class="message mod-indicator-btn"><div class="message-text">' + err + '</div></div>']);
      return;
    }
    loadIssues();
  });
}

function loadReleases() {
  if (!currentRepo) return;
  setPages(['<div class="message"><div class="message-text">Loading Releases...</div></div>']);
  apiRequest('GET', 'https://api.github.com/repos/' + currentRepo + '/releases?per_page=10', null, null, function(err, res) {
    if (err) {
      setPages(['<div class="message"><div class="message-text">' + err + '</div></div>']);
      return;
    }
    var rels = JSON.parse(res);
    if (!rels.length) {
      setPages(['<div class="message purged-msg"><div class="message-text">No releases published for this repo.</div></div>']);
      return;
    }
    var chunks = [];
    for (var i = 0; i < rels.length; i++) {
      var r = rels[i];
      var notes = (r.body || 'No release notes.').replace(/</g, '&lt;');
      var html = '<div class="admin-msg"><div class="message-text"><b>RELEASE: ' + (r.name || r.tag_name) + ' (' + r.tag_name + ')</b></div></div>';
      html += '<div class="message"><div class="message-text">' + notes + '</div></div>';
      chunks.push(html);
    }
    setPages(chunks);
  });
}

function searchGitHub() {
  var q = document.getElementById('content').value.replace(/^\s+|\s+$/g, '');
  if (!q) return;
  setPages(['<div class="message"><div class="message-text">Searching GitHub for "' + q + '"...</div></div>']);
  apiRequest('GET', 'https://api.github.com/search/repositories?q=' + encodeURIComponent(q) + '&per_page=10', null, null, function(err, res) {
    if (err) {
      setPages(['<div class="message"><div class="message-text">' + err + '</div></div>']);
      return;
    }
    var items = JSON.parse(res).items;
    var html = '<div class="admin-msg"><div class="message-text"><b>SEARCH RESULTS FOR: ' + q + '</b></div></div>';
    for (var i = 0; i < items.length; i++) {
      var r = items[i];
      html += '<div class="message"><div class="message-text">';
      html += '<span class="roster-name" onclick="loadRepo(\'' + r.full_name + '\')">' + r.full_name + '</span> (★ ' + r.stargazers_count + ')\n';
      html += (r.description || 'No description.');
      html += '</div><div class="mod-action-tray"><button class="mod-tray-btn" onclick="loadRepo(\'' + r.full_name + '\')">OPEN REPO</button></div></div>';
    }
    setPages([html]);
  });
}

function toggleAuth(show) {
  document.getElementById('auth-screen').style.display = show ? 'flex' : 'none';
}

function saveToken() {
  ghToken = document.getElementById('token-input').value.replace(/^\s+|\s+$/g, '');
  toggleAuth(false);
  showHome(); // Refresh home dashboard to load user repos immediately!
}

function flashInk() {
  document.body.style.filter = 'invert(100%)';
  setTimeout(function() { document.body.style.filter = 'none'; }, 180);
}

// Boot up to Home Dashboard instead of a hardcoded repo!
showHome();
</script>
</body>
</html>
