<!DOCTYPE html>
<html>
<head>
    <title>Kindle Remote Phone Control</title>
    <style>
        body { margin: 0; padding: 0; background: black; text-align: center; color: white; font-family: sans-serif; }
        img { max-width: 100%; height: auto; cursor: pointer; border: 1px solid #333; }
        #setup { padding: 20px; }
        input { padding: 8px; width: 250px; }
        button { padding: 8px; }
    </style>
    <script>
        let serverUrl = "";

        function connectServer() {
            let inputUrl = document.getElementById("urlInput").value.trim();
            
            // Wymuszenie protokołu HTTPS w celu uniknięcia błędu Mixed Content
            if (inputUrl.startsWith("http://")) {
                inputUrl = inputUrl.replace("http://", "https://");
            }
            if (!inputUrl.startsWith("https://")) {
                inputUrl = "https://" + inputUrl;
            }
            
            // Usunięcie ukośnika z końca, jeśli istnieje
            if (inputUrl.endsWith("/")) {
                inputUrl = inputUrl.slice(0, -1);
            }
            
            serverUrl = inputUrl;
            
            // Ładowanie bezpiecznego strumienia wideo
            document.getElementById("screen").src = serverUrl + "/video_feed";
            document.getElementById("setup").style.display = "none";
            document.getElementById("screen").style.display = "inline-block";
        }

        function sendClick(event) {
            if (!serverUrl) return;

            var img = document.getElementById("screen");
            var rect = img.getBoundingClientRect();
            
            // Obliczanie procentowych współrzędnych miejsca kliknięcia
            var relX = (event.clientX - rect.left) / rect.width;
            var relY = (event.clientY - rect.top) / rect.height;
            
            // Wysłanie współrzędnych do serwera lokalnego
            var xhr = new XMLHttpRequest();
            xhr.open("GET", serverUrl + "/click?x=" + relX + "&y=" + relY, true);
            xhr.send();
        }
    </script>
</head>
<body>

    <div id="setup">
        <h3>Enter your Ngrok Server URL:</h3>
        <input type="text" id="urlInput" placeholder="e.g., cb8e-93-159-12-2.ngrok-free.app">
        <button onclick="connectServer()">Connect</button>
    </div>

    <img id="screen" src="" onclick="sendClick(event)" style="display:none;">

</body>
</html>
