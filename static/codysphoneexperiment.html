<!DOCTYPE html>
<html>
<head>
    <title>Experiment! VNC Android onto Kindle</title>
    <style>
        body { margin: 0; padding: 0; background: black; overflow: hidden; font-family: sans-serif; }
        #setup { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 5px; color: white; border: 1px solid #333; }
        input { padding: 8px; width: 220px; background: #222; border: 1px solid #444; color: white; }
        button { padding: 8px 12px; background: #007acc; color: white; border: none; cursor: pointer; }
        /* Kontener na pełny ekran z VNC */
        #vnc-screen { width: 100vw; height: 100vh; border: none; }
    </style>
    <script>
        function connectVNC() {
            let inputUrl = document.getElementById("urlInput").value.trim();
            
            // Czyszczenie adresu z protokołów
            inputUrl = inputUrl.replace("https://", "").replace("http://", "").replace("://", "");
            if (inputUrl.endsWith("/")) inputUrl = inputUrl.slice(0, -1);
            
            // noVNC potrzebuje oficjalnej e-papierowej ramki do wyświetlenia obrazu i obsługi dotyku
            // Łączymy się przez darmowy web-klient noVNC podając Twój tunel
            const noVncUrl = "https://novnc.com" + inputUrl + "&port=443&autoconnect=true&encrypt=true";
            
            document.getElementById("vnc-screen").src = noVncUrl;
            document.getElementById("setup").style.display = "none";
        }
    </script>
</head>
<body>

    <div id="setup">
        <h4 style="margin: 0 0 10px 0;">Połączenie VNC (50 osób)</h4>
        <input type="text" id="urlInput" placeholder="Wklej link z Pinggy (np. xxxx.pgyer.link)">
        <button onclick="connectVNC()">Połącz system</button>
    </div>

    <!-- Ramka, która automatycznie obsłuży wideo oraz kliknięcia użytkowników -->
    <iframe id="vnc-screen" src=""></iframe>

</body>
</html>
