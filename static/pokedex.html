<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://louisabraham.github.io/nekojs/neko.js" data-autostart></script>
    <title>Pokédex</title>
    <style>
        * {
            transition: none !important;
            animation: none !important;
        }
        body {
            font-family: "Verdana", "Arial", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e5e5e5;
        }
        .pokedex-container {
            width: 90%;
            max-width: 500px;
            background-color: #fff;
            border: 2px solid #000;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 80vh;
            box-sizing: border-box;
        }
        .hidden {
            display: none !important;
        }
        #list-view, #detail-view {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0; /* lets children scroll inside a fixed-height flex parent */
        }
        .search-bar {
            margin-bottom: 15px;
        }
        .search-bar input[type="text"] {
            width: 100%;
            min-height: 48px;
            padding: 10px;
            border: 2px solid #000;
            font-size: 16px;
            box-sizing: border-box;
            font-family: "Courier New", monospace;
        }
        .close-button {
            position: absolute;
            top: -16px;
            right: -16px;
            text-decoration: none;
            color: #000;
            background: #fff;
            border: 2px solid #000;
            font-weight: bold;
            font-size: 20px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        #pokemon-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
            border: 2px solid #000;
        }
        #pokemon-list li {
            padding: 10px;
            border-bottom: 2px solid #000;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        #pokemon-list li:last-child {
            border-bottom: none;
        }
        #pokemon-list li:hover, #pokemon-list li:active {
            background-color: #000;
            color: #fff;
        }
        .pkmn-thumb {
            width: 50px;
            height: 50px;
            margin-right: 15px;
            border: 1px solid #000;
            background: #fafafa;
            object-fit: contain;
        }
        #pokemon-list li:hover .pkmn-thumb, #pokemon-list li:active .pkmn-thumb {
            border-color: #fff;
            background: #333;
        }
        .pokemon-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .pokemon-name {
            font-weight: bold;
            text-transform: capitalize;
            font-size: 1rem;
        }
        .pokemon-id {
            font-size: 0.85rem;
            font-family: "Courier New", monospace;
        }
        .status-msg {
            text-align: center;
            padding: 20px;
            font-weight: bold;
            font-family: "Courier New", monospace;
        }
        .load-more-row {
            justify-content: center;
            font-weight: bold;
            font-family: "Courier New", monospace;
            text-align: center;
            min-height: 48px;
            box-sizing: border-box;
        }

        /* ---- Detail view ---- */
        .back-button {
            align-self: flex-start;
            background: #fff;
            border: 2px solid #000;
            font-family: "Courier New", monospace;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 6px 16px;
            min-height: 48px;
            box-sizing: border-box;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .back-button:active {
            background: #000;
            color: #fff;
        }
        #detail-content {
            flex-grow: 1;
            overflow-y: auto;
            border: 2px solid #000;
            padding: 15px;
            box-sizing: border-box;
        }
        .detail-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .detail-sprite {
            width: 80px;
            height: 80px;
            border: 1px solid #000;
            background: #fafafa;
            object-fit: contain;
            flex-shrink: 0;
            margin-right: 15px;
        }
        .detail-name-block {
            display: flex;
            flex-direction: column;
        }
        .detail-name {
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: capitalize;
        }
        .detail-id {
            font-family: "Courier New", monospace;
            font-size: 0.85rem;
        }
        .detail-genus {
            font-style: italic;
            font-size: 0.85rem;
            margin-top: 2px;
        }
        .type-badges {
            display: flex;
            margin-bottom: 7px;
            flex-wrap: wrap;
        }
        .type-badge {
            border: 2px solid #000;
            padding: 2px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            color: #000;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        .detail-section {
            margin-bottom: 15px;
        }
        .detail-section h3 {
            font-size: 0.8rem;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #000;
            padding-bottom: 3px;
        }
        .detail-flavor {
            font-size: 0.9rem;
            line-height: 1.4;
            margin: 0;
        }
        .physical-row {
            display: flex;
            font-family: "Courier New", monospace;
            font-size: 0.9rem;
        }
        .physical-row span {
            margin-right: 25px;
        }
        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-family: "Courier New", monospace;
            font-size: 0.75rem;
        }
        .stat-label {
            width: 55px;
            text-transform: uppercase;
            margin-right: 8px;
        }
        .stat-bar-track {
            flex-grow: 1;
            background: #eee;
            border: 1px solid #000;
            height: 10px;
            display: block;
            margin-right: 8px;
        }
        .stat-bar-fill {
            background: #000;
            height: 100%;
            display: block;
        }
        .stat-value {
            width: 28px;
            text-align: right;
        }
        .abilities-list {
            margin: 0;
            padding-left: 18px;
            font-size: 0.9rem;
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <div class="pokedex-container">
        <a href="index.html" class="close-button">&times;</a>

        <div id="list-view">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Enter Name or National ID...">
            </div>

            <ul id="pokemon-list">
                <div class="status-msg" id="status-field">Loading National Pokédex entries...</div>
            </ul>
        </div>

        <div id="detail-view" class="hidden">
            <button type="button" id="back-button" class="back-button">&larr; Back</button>
            <div id="detail-content"></div>
        </div>
    </div>

    <script>
        // ---- Config ----
        const CACHE_KEY = 'pokedex-national-dex-v1';
        const PAGE_SIZE = 60;        // how many rows we build at once
        const SEARCH_DEBOUNCE_MS = 200;
        const STAT_MAX = 200;        // scale for the base-stat bars

        const TYPE_COLORS = {
            normal: '#A8A878', fire: '#F08030', water: '#6890F0', electric: '#F8D030',
            grass: '#78C850', ice: '#98D8D8', fighting: '#C03028', poison: '#A040A0',
            ground: '#E0C068', flying: '#A890F0', psychic: '#F85888', bug: '#A8B820',
            rock: '#B8A038', ghost: '#705898', dragon: '#7038F8', dark: '#705848',
            steel: '#B8B8D0', fairy: '#EE99AC'
        };

        const STAT_LABELS = {
            hp: 'HP', attack: 'ATK', defense: 'DEF',
            'special-attack': 'SP.ATK', 'special-defense': 'SP.DEF', speed: 'SPD'
        };

        let nationalDex = [];        // full list, loaded once
        let currentView = [];        // list currently filtered/searched
        let renderedCount = 0;       // how many of currentView are in the DOM
        let currentDetailId = null;  // guards against stale/late fetches
        const detailCache = new Map(); // in-memory cache for opened entries this session

        // ---------------- List loading ----------------

        async function fetchNationalPokedex() {
            const statusField = document.getElementById('status-field');

            // Serve from cache first so repeat visits skip the network entirely.
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    nationalDex = JSON.parse(cached);
                    startList(nationalDex);
                    return;
                }
            } catch (e) {
                // localStorage unavailable or corrupt cache - fall through to fetch
            }

            try {
                // Fetch first 898 canonical National Pokédex entries (Generations 1-8)
                const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=898');
                if (!response.ok) throw new Error("Network issue");
                const data = await response.json();

                nationalDex = data.results.map((pokemon, index) => {
                    const id = index + 1;
                    return {
                        id: id,
                        name: pokemon.name,
                        image: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`
                    };
                });

                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(nationalDex));
                } catch (e) {
                    // storage full/unavailable - not fatal, just skip caching
                }

                startList(nationalDex);
            } catch (error) {
                statusField.textContent = "Failed to query PokéAPI. Please check your connection.";
            }
        }

        // Reset the list view (new search or initial load) and render the first page.
        function startList(pokemonArray) {
            currentView = pokemonArray;
            renderedCount = 0;

            const pokemonList = document.getElementById('pokemon-list');
            pokemonList.innerHTML = '';

            if (pokemonArray.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'status-msg';
                emptyMsg.textContent = "No entries found.";
                pokemonList.appendChild(emptyMsg);
                return;
            }

            renderNextPage();
        }

        // Append the next PAGE_SIZE rows (and the "load more" row) in one batch.
        function renderNextPage() {
            const pokemonList = document.getElementById('pokemon-list');

            const oldLoadMore = document.getElementById('load-more-btn');
            if (oldLoadMore) oldLoadMore.remove();

            const slice = currentView.slice(renderedCount, renderedCount + PAGE_SIZE);
            const fragment = document.createDocumentFragment();

            slice.forEach(pokemon => {
                fragment.appendChild(buildRow(pokemon));
            });

            renderedCount += slice.length;
            pokemonList.appendChild(fragment);

            if (renderedCount < currentView.length) {
                const li = document.createElement('li');
                li.id = 'load-more-btn';
                li.className = 'load-more-row';
                li.textContent = `Load more (${currentView.length - renderedCount} left)`;
                pokemonList.appendChild(li);
            }
        }

        function buildRow(pokemon) {
            const li = document.createElement('li');
            li.dataset.id = pokemon.id;

            const img = document.createElement('img');
            img.className = 'pkmn-thumb';
            img.loading = 'lazy';           // don't fetch offscreen images until scrolled into view
            img.decoding = 'async';
            img.src = pokemon.image;
            img.alt = pokemon.name;
            img.onerror = () => { img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="black" fill="none"/></svg>'; };

            const infoDiv = document.createElement('div');
            infoDiv.className = 'pokemon-info';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'pokemon-name';
            nameSpan.textContent = pokemon.name.replace('-', ' ');

            const idSpan = document.createElement('span');
            idSpan.className = 'pokemon-id';
            idSpan.textContent = `#${String(pokemon.id).padStart(3, '0')}`;

            infoDiv.appendChild(nameSpan);
            infoDiv.appendChild(idSpan);

            li.appendChild(img);
            li.appendChild(infoDiv);
            return li;
        }

        // ---------------- Detail view ----------------

        function showListView() {
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('list-view').classList.remove('hidden');
        }

        function showDetailView() {
            document.getElementById('list-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
        }

        function openDetail(id) {
            currentDetailId = id;
            showDetailView();

            const cached = detailCache.get(id);
            if (cached) {
                renderDetail(cached);
                return;
            }

            renderDetailLoading();
            fetchDetail(id);
        }

        async function fetchDetail(id) {
            try {
                const [pokemonRes, speciesRes] = await Promise.all([
                    fetch(`https://pokeapi.co/api/v2/pokemon/${id}`),
                    fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`)
                ]);
                if (!pokemonRes.ok || !speciesRes.ok) throw new Error("detail fetch failed");

                const pokemonData = await pokemonRes.json();
                const speciesData = await speciesRes.json();

                const flavorEntry = speciesData.flavor_text_entries.find(e => e.language.name === 'en');
                const flavorText = flavorEntry ? flavorEntry.flavor_text.replace(/[\n\f\r]+/g, ' ') : '';

                const genusEntry = speciesData.genera.find(g => g.language.name === 'en');

                const localEntry = nationalDex.find(p => p.id === id);

                const detail = {
                    id: id,
                    name: pokemonData.name,
                    image: (localEntry && localEntry.image) || pokemonData.sprites.front_default,
                    types: pokemonData.types.map(t => t.type.name),
                    heightM: (pokemonData.height / 10).toFixed(1),
                    weightKg: (pokemonData.weight / 10).toFixed(1),
                    abilities: pokemonData.abilities.map(a => ({
                        name: a.ability.name.replace(/-/g, ' '),
                        hidden: a.is_hidden
                    })),
                    stats: pokemonData.stats.map(s => ({ name: s.stat.name, value: s.base_stat })),
                    genus: genusEntry ? genusEntry.genus : '',
                    flavorText: flavorText
                };

                detailCache.set(id, detail);

                // Only render if the user hasn't navigated to a different entry in the meantime.
                if (currentDetailId === id) renderDetail(detail);
            } catch (error) {
                if (currentDetailId === id) renderDetailError();
            }
        }

        function renderDetailLoading() {
            const container = document.getElementById('detail-content');
            container.innerHTML = '';
            const msg = document.createElement('div');
            msg.className = 'status-msg';
            msg.textContent = 'Loading entry...';
            container.appendChild(msg);
        }

        function renderDetailError() {
            const container = document.getElementById('detail-content');
            container.innerHTML = '';
            const msg = document.createElement('div');
            msg.className = 'status-msg';
            msg.textContent = 'Failed to load this entry. Please check your connection.';
            container.appendChild(msg);
        }

        function renderDetail(detail) {
            const container = document.getElementById('detail-content');
            container.innerHTML = '';

            // Header: sprite + name / national id / genus
            const header = document.createElement('div');
            header.className = 'detail-header';

            const img = document.createElement('img');
            img.className = 'detail-sprite';
            img.src = detail.image;
            img.alt = detail.name;
            img.onerror = () => { img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="black" fill="none"/></svg>'; };

            const nameBlock = document.createElement('div');
            nameBlock.className = 'detail-name-block';

            const nameEl = document.createElement('div');
            nameEl.className = 'detail-name';
            nameEl.textContent = detail.name.replace(/-/g, ' ');

            const idEl = document.createElement('div');
            idEl.className = 'detail-id';
            idEl.textContent = `#${String(detail.id).padStart(3, '0')}`;

            nameBlock.appendChild(nameEl);
            nameBlock.appendChild(idEl);

            if (detail.genus) {
                const genusEl = document.createElement('div');
                genusEl.className = 'detail-genus';
                genusEl.textContent = detail.genus;
                nameBlock.appendChild(genusEl);
            }

            header.appendChild(img);
            header.appendChild(nameBlock);
            container.appendChild(header);

            // Type badges
            const typeRow = document.createElement('div');
            typeRow.className = 'type-badges';
            detail.types.forEach(type => {
                const badge = document.createElement('span');
                badge.className = 'type-badge';
                badge.textContent = type;
                badge.style.backgroundColor = TYPE_COLORS[type] || '#ccc';
                typeRow.appendChild(badge);
            });
            container.appendChild(typeRow);

            // Pokédex entry / description
            if (detail.flavorText) {
                const p = document.createElement('p');
                p.className = 'detail-flavor';
                p.textContent = detail.flavorText;
                container.appendChild(buildSection('Pokédex Entry', p));
            }

            // Physical stats
            const physical = document.createElement('div');
            physical.className = 'physical-row';
            const heightEl = document.createElement('span');
            heightEl.textContent = `Height: ${detail.heightM} m`;
            const weightEl = document.createElement('span');
            weightEl.textContent = `Weight: ${detail.weightKg} kg`;
            physical.appendChild(heightEl);
            physical.appendChild(weightEl);
            container.appendChild(buildSection('Physical', physical));

            // Base stats
            const statsWrap = document.createElement('div');
            detail.stats.forEach(stat => {
                const row = document.createElement('div');
                row.className = 'stat-row';

                const label = document.createElement('span');
                label.className = 'stat-label';
                label.textContent = STAT_LABELS[stat.name] || stat.name;

                const track = document.createElement('span');
                track.className = 'stat-bar-track';
                const fill = document.createElement('span');
                fill.className = 'stat-bar-fill';
                fill.style.width = `${Math.min(100, (stat.value / STAT_MAX) * 100)}%`;
                track.appendChild(fill);

                const value = document.createElement('span');
                value.className = 'stat-value';
                value.textContent = stat.value;

                row.appendChild(label);
                row.appendChild(track);
                row.appendChild(value);
                statsWrap.appendChild(row);
            });
            container.appendChild(buildSection('Base Stats', statsWrap));

            // Abilities
            const abilityList = document.createElement('ul');
            abilityList.className = 'abilities-list';
            detail.abilities.forEach(a => {
                const li = document.createElement('li');
                li.textContent = a.hidden ? `${a.name} (Hidden Ability)` : a.name;
                abilityList.appendChild(li);
            });
            container.appendChild(buildSection('Abilities', abilityList));
        }

        function buildSection(title, contentEl) {
            const section = document.createElement('div');
            section.className = 'detail-section';
            const h3 = document.createElement('h3');
            h3.textContent = title;
            section.appendChild(h3);
            section.appendChild(contentEl);
            return section;
        }

        // ---------------- Init ----------------

        function initPokedex() {
            fetchNationalPokedex();

            const searchInput = document.getElementById('search-input');
            const pokemonList = document.getElementById('pokemon-list');

            let debounceTimer = null;
            searchInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    const query = searchInput.value.toLowerCase().trim();
                    const filtered = nationalDex.filter(pokemon =>
                        pokemon.name.toLowerCase().includes(query) ||
                        String(pokemon.id).includes(query)
                    );
                    startList(filtered);
                }, SEARCH_DEBOUNCE_MS);
            });

            pokemonList.addEventListener('click', (event) => {
                const item = event.target.closest('li');
                if (!item) return;

                if (item.id === 'load-more-btn') {
                    renderNextPage();
                    return;
                }

                const id = Number(item.dataset.id);
                if (id) openDetail(id);
            });

            document.getElementById('back-button').addEventListener('click', showListView);
        }

        document.addEventListener('DOMContentLoaded', initPokedex);
    </script>
</body>
</html>
